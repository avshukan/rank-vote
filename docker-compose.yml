services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rank_vote
      POSTGRES_USER: rank_vote
      POSTGRES_PASSWORD: rank_vote
    ports:
      - '${RANK_VOTE_POSTGRES_PORT:-5432}:5432'
    volumes:
      - rank_vote_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-database.sql:/docker-entrypoint-initdb.d/init-test-database.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rank_vote -d rank_vote']
      interval: 2s
      timeout: 5s
      retries: 15

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: rank-vote-api:local
    environment:
      DATABASE_URL: postgresql://rank_vote:rank_vote@postgres:5432/rank_vote?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: ['pnpm', 'run', 'db:deploy']
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: rank-vote-api:local
    environment:
      DATABASE_URL: postgresql://rank_vote:rank_vote@postgres:5432/rank_vote?schema=public
      PORT: '3000'
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - '${RANK_VOTE_API_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/api/v1/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 15

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
    image: rank-vote-web:local
    ports:
      - '${RANK_VOTE_WEB_PORT:-5173}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'test -s /usr/share/nginx/html/index.html && wget -qO- http://127.0.0.1/ | grep -q ''<div id="root"></div>''',
        ]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  rank_vote_postgres_data:
