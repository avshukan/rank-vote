name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rank_vote_test
          POSTGRES_USER: rank_vote
          POSTGRES_PASSWORD: rank_vote
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rank_vote -d rank_vote_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://rank_vote:rank_vote@localhost:5432/rank_vote_test?schema=public
    steps:
      - uses: actions/checkout@v6
      # pnpm/action-setup must run before setup-node for cache: pnpm to work;
      # the pnpm version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
